<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Шайдон: поездка</title>
<meta name="description" content="Drive a car around the 3D model of the town, built from real map data.">
<style>
  :root {
    --bg: #0d1013;
    --panel: rgba(16, 20, 24, 0.6);
    --line: rgba(255, 255, 255, 0.12);
    --text: #eef1f3;
    --muted: #a7b0b8;
    --accent: #e9b44c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; user-select: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #title { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
    padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
  #title b { font-size: 16px; }
  #title span { color: var(--muted); font-size: 12px; }
  #menu { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    padding: 6px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; align-items: center; }
  #menu button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 12.5px; white-space: nowrap; }
  #menu button:hover, #menu button:focus-visible { background: rgba(255,255,255,.1); }
  #menu label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; padding: 0 6px; }
  #time { width: 96px; accent-color: var(--accent); }
  #speed { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding: 8px 14px; text-align: right; font-variant-numeric: tabular-nums; }
  #speed b { font-size: 34px; font-weight: 650; line-height: 1; display: block; }
  #speed span { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
  #help { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font-size: 12.5px; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px rgba(0,0,0,.8); white-space: nowrap; }
  #attrib { position: absolute; left: 8px; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); font-size: 9.5px;
    color: rgba(255,255,255,.6); text-shadow: 0 1px 2px #000; max-width: 55vw; pointer-events: none; }
  #pads { display: none; }
  body.touch #pads { display: block; }
  body.touch #help { display: none; }
  body.touch #speed { bottom: auto; right: auto; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px)); padding: 4px 12px; text-align: center; }
  body.touch #speed b { font-size: 24px; }
  body.touch #attrib { left: 50%; transform: translateX(-50%); text-align: center; max-width: 42vw; font-size: 8px; }
  @media (max-width: 900px) { body.touch #title { display: none; } }
  .pad { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }
  .pad.l { left: calc(18px + env(safe-area-inset-left, 0px)); }
  .pad.r { right: calc(18px + env(safe-area-inset-right, 0px)); flex-direction: column-reverse; }
  .pad button { all: unset; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(16,20,24,.5); border: 1px solid var(--line); font-size: 26px; color: var(--text);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: none; }
  .pad button.down { background: rgba(233,180,76,.35); border-color: var(--accent); }
  #loader { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .7s; z-index: 5; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader h2 { margin: 0 0 6px; font-size: 24px; text-align: center; }
  #status { color: var(--muted); text-align: center; font-size: 13px; }
  @media (max-width: 600px) { #title span { display: none; } #menu label { display: none; } }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="title" class="panel"><b>Шайдон</b><span>катайтесь по городу</span></div>
<div id="menu" class="panel">
  <label>Время <input id="time" type="range" min="5.5" max="21" step="0.05" value="16"><span id="timeval">16:00</span></label>
  <button id="cam" type="button">Камера: Сзади</button>
  <button id="reset" type="button">В начало</button>
</div>
<div id="speed" class="panel"><b>0</b><span>КМ/Ч</span></div>
<div id="help">↑ ↓ или W S — газ и тормоз · ← → или A D — руль · пробел — ручник · C — камера · R — в начало</div>
<div id="pads">
  <div class="pad l"><button data-touch="left" aria-label="Влево">◀</button><button data-touch="right" aria-label="Вправо">▶</button></div>
  <div class="pad r"><button data-touch="down" aria-label="Тормоз и задний ход">▼</button><button data-touch="up" aria-label="Газ">▲</button></div>
</div>
<div id="attrib"></div>
<div id="loader"><div><h2>Загрузка…</h2><div id="status">Данные карты…</div></div></div>
<script type="module" src="src/drive.js"></script>
</body>
</html>
