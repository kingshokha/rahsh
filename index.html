<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рахш</title>
<meta name="description" content="Рахш — интернет-магазин. Доставка и самовывоз.">
<meta property="og:title" content="Рахш">
<meta property="og:description" content="Интернет-магазин. Доставка и самовывоз.">
<meta name="theme-color" content="#1f5c48">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5c48'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23fff'%3E%D0%A0%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#f4f4f1;overflow:hidden}
  @media (prefers-color-scheme: dark){html,body{background:#111314}}
  #shop{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block}
  #wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#6b6f73;transition:opacity .3s}
  #wait b{font-size:28px;letter-spacing:-.02em;color:#1f5c48}
  #wait i{width:28px;height:28px;border:3px solid #1f5c48;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-color-scheme: dark){#wait b{color:#7cc8a9}#wait i{border-color:#7cc8a9;border-right-color:transparent}}
</style>
</head>
<body>
<div id="wait"><b>Рахш</b><i></i></div>
<iframe id="shop" title="Рахш" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  // Адрес магазина (развёртывание Apps Script). При смене развёртывания поменяйте только эту строку.
  var APP = 'https://script.google.com/macros/s/AKfycby3DY8MoP-cRlFgVyLmYZOMZREdxkhtOq3yQ_FJ9v04JnYzcRR0XMN830RsXxZMGJGU/exec';
  var f = document.getElementById('shop');
  f.addEventListener('load', function () {
    var w = document.getElementById('wait');
    w.style.opacity = '0';
    setTimeout(function () { w.remove(); }, 300);
  });
  // ?admin=1 на этой странице открывает панель продавца
  f.src = APP + (location.search || '');
</script>
</body>
</html>
